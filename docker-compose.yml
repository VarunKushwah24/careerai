version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerai-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=careerai-super-secret-jwt-key-aiml-2026
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
    volumes:
      - backend-uploads:/app/uploads
      - backend-data:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careerai-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend-uploads:
  backend-data:
